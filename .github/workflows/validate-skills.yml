name: Validate skills

on:
  push:
    branches: [main]
    paths:
      - "skills/**"
  pull_request:
    paths:
      - "skills/**"
  workflow_dispatch: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, pineado por SHA (M-9, auditoría externa 2026-09-26) — verificado con git ls-remote contra el tag real
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0, pineado por SHA (M-9) — verificado con git ls-remote contra el tag real
        with:
          python-version: "3.12"
      # HALLAZGO REAL DE AUDITORÍA EXTERNA (B-10, 2026-09-27): antes,
      # una lista ad-hoc sin pinear (pyyaml/python-dotenv/pydantic/
      # cryptography) que duplicaba un subconjunto de requirements-core.txt
      # sin sus versiones exactas — requirements-core.txt ya es superset
      # de lo que validate_skills.py necesita (mismo archivo que usa
      # ci.yml), así que instalarlo de ahí evita la duplicación Y
      # hereda el pineo exacto ya establecido (ver M-9).
      - run: pip install -r requirements-core.txt
      - run: python3 scripts/validate_skills.py
