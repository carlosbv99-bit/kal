name: CI

# Pipeline general (tests + lint) en cada push/PR — a diferencia de
# validate-skills.yml (que solo corre cuando cambia skills/**), este
# corre siempre. Kernel puro: sin agente, sin ML — requirements-core.txt
# es la lista completa real (verificada con grep antes de extraer este
# repo de kal-in, ver docs/HISTORY.md), no una selección parcial.
#
# Docker SÍ está disponible por defecto en runners ubuntu-latest (sin
# necesidad de servicios extra ni de construir una imagen) — los tests
# marcados con `requires_docker` (ver tests/conftest.py) corren de
# verdad acá, no se saltan.

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, pineado por SHA (M-9, auditoría externa 2026-09-26) — verificado con git ls-remote contra el tag real

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0, pineado por SHA (M-9) — verificado con git ls-remote contra el tag real
        with:
          python-version: "3.12"
          cache: "pip"

      # clamav (binario clamscan, no un daemon) — necesario para los
      # tests reales de escaneo de artefactos de skills (fail-closed
      # por diseño, ver kernel/security/malware_scan.py); sin esto esos
      # tests puntuales rechazarían el escaneo en vez de pasar.
      - name: Instalar ClamAV
        run: sudo apt-get update && sudo apt-get install -y clamav

      - name: Instalar dependencias
        run: pip install -r requirements-core.txt -r requirements-dev.txt

      - name: Lint (solo errores reales — sintaxis/pyflakes, no estilo)
        run: python -m ruff check --select=E9,F .

      # Agregado 2026-09-27, preparando una auditoría externa. Corrido en
      # vivo antes de agregarlo: "No known vulnerabilities found" contra
      # requirements-core.txt + requirements-dev.txt — el dependency set
      # chico del kernel puro (sin chromadb/diffusers/etc.) ayuda acá. No
      # bloqueante todavía a propósito, mismo criterio que kal-in: para
      # que una vulnerabilidad nueva en cualquier dependencia no pase
      # desapercibida, sin que el build dependa de si ya existe un fix
      # publicado para ella.
      - name: Auditoría de dependencias (reporta, no bloquea todavía)
        run: |
          pip install -q pip-audit
          pip-audit -r requirements-core.txt -r requirements-dev.txt || true

      # Los tests de sandbox ejecutan contenedores REALES contra
      # kal-sandbox-minimal:latest (ver kernel/lifecycle/skill_image_builder.py,
      # MINIMAL_IMAGE). El runner ubuntu-latest trae Docker, pero NO la imagen:
      # sin este paso, test_skills.py falla con "sandbox image not found:
      # kal-sandbox-minimal:latest" y el CI quedaba en rojo por algo que no era
      # el código. Los tests que SÍ saben saltearse cuando la imagen no está
      # (test_sandbox_image_hardening.py) la usan si está, así que construyéndola
      # se ejecutan también esos.
      - name: Construir la imagen del sandbox
        run: bash scripts/build_sandbox_image.sh

      - name: Tests
        run: python -m pytest tests/ -q
